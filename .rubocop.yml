require:
  - ./tools/rubocop/curriculum.rb

plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 4.0
  NewCops: enable

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

Metrics/MethodLength:
  Max: 20
  Exclude:
    - 'test/**/*'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'

Minitest/MultipleAssertions:
  Exclude:
    - 'test/**/*'

Rkoans/Curriculum:
  Enabled: true
  Include:
    - 'rkoans.gemspec'
